apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tp1-gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: tp1
  source:
    repoURL: https://github.com/Kousay-Jebir/tp1-gitops.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: tp1-gitops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true